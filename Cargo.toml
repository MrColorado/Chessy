[package]
name = "chess"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "chess-uci"
path = "src/bin/uci.rs"

[[bin]]
name = "chess-lichess"
path = "src/bin/lichess.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
axum = "0.7"
bytes = "1"
