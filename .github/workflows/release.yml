name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
          - os: macos-latest
            suffix: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: cargo build --release
      - name: Package binaries
        run: |
          cp target/release/chess-uci     chess-uci-${{ github.ref_name }}-${{ matrix.suffix }}
          cp target/release/chess-lichess chess-lichess-${{ github.ref_name }}-${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: |
            chess-uci-${{ github.ref_name }}-${{ matrix.suffix }}
            chess-lichess-${{ github.ref_name }}-${{ matrix.suffix }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            chess-uci-*
            chess-lichess-*
          generate_release_notes: true
